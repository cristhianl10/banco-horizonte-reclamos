name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: API .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BancoHorizonte.slnx
      - run: dotnet build BancoHorizonte.slnx --configuration Release --no-restore
      - run: dotnet test tests/BancoHorizonte.Api.Tests/BancoHorizonte.Api.Tests.csproj --configuration Release --no-build --no-restore

  frontend:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/banco-horizonte-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/banco-horizonte-web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --progress=false
      - run: npm run build

  contenedor:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag banco-horizonte-api:ci .
